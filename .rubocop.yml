AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_admin/resolvers/**/*'
    - 'lib/recording_studio_admin/widget.rb'
    - 'lib/recording_studio_admin/context.rb'
    - 'lib/recording_studio_admin/period.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_admin/filters/date_range_filter.rb'
    - 'lib/recording_studio_admin/resolvers/**/*'
    - 'lib/recording_studio_admin/widget.rb'
    - 'lib/recording_studio_admin/period.rb'
    - 'lib/recording_studio_admin/screen.rb'
    - 'lib/recording_studio_admin/widget_change_semantics.rb'
    - 'lib/recording_studio_admin/context.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_admin/filters/date_range_filter.rb'
    - 'lib/recording_studio_admin/resolvers/**/*'
    - 'lib/recording_studio_admin/screen.rb'
    - 'lib/recording_studio_admin/period.rb'
    - 'lib/recording_studio_admin/widget.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_admin/context.rb'
    - 'lib/recording_studio_admin/filters/date_range_filter.rb'
    - 'lib/recording_studio_admin/resolvers/**/*'
    - 'lib/recording_studio_admin/period.rb'
    - 'lib/recording_studio_admin/url_safety.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_admin/filters/date_range_filter.rb'
    - 'lib/recording_studio_admin/resolvers/**/*'
    - 'lib/recording_studio_admin/period.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_admin/period.rb'
    - 'lib/recording_studio_admin/screen.rb'
    - 'lib/recording_studio_admin/widget.rb'
    - 'lib/recording_studio_admin/context.rb'
    - 'lib/recording_studio_admin/section.rb'

Metrics/BlockLength:
  Exclude:
    - 'test/recording_studio_v3_test.rb'

Style/MultilineBlockChain:
  Exclude:
    - 'lib/recording_studio_admin/resolvers/available_sections_resolver.rb'
    - 'lib/recording_studio_admin/resolvers/sections_resolver.rb'

Style/OptionalBooleanParameter:
  Exclude:
    - 'lib/recording_studio_admin/screen.rb'
    - 'lib/recording_studio_admin/widget.rb'

Style/ClassAndModuleChildren:
  Exclude:
    - 'lib/generators/recording_studio_admin/admin_root/templates/app/controllers/admin/*.rb'
